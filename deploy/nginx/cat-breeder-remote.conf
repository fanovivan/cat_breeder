# =============================================================================
# Cat Breeder — Nginx для удалённого сервера (Ubuntu / Debian и аналоги)
# =============================================================================
#
# Схема:
# — Angular после `ng build`: файлы из dist/frontend/browser → root ниже.
# — Gunicorn+ASGI слушает 127.0.0.1:8000 → см. upstream.
# — После `collectstatic`: каталог STATIC_ROOT → alias для /static/
#
# Django (.env или переменные окружения):
#   ALLOWED_HOSTS=<домен>,www.<домен>
#   CSRF_TRUSTED_ORIGINS=https://<домен>,https://www.<домен>
#   DEBUG=False
#
# Установка:
#   sudo cp deploy/nginx/cat-breeder-remote.conf /etc/nginx/sites-available/cat-breeder
#   Правки: server_name, root, alias /static/, при необходимости порт upstream
#   sudo ln -sf /etc/nginx/sites-available/cat-breeder /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: sudo certbot --nginx -d ваш_домен
# =============================================================================

upstream cat_breeder_django {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/cat_breeder/browser;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://cat_breeder_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://cat_breeder_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /ws/ {
        proxy_pass http://cat_breeder_django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /static/ {
        alias /var/www/cat_breeder/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
