# Замена для frontend/nginx/default.conf при docker compose на сервере.
# Upstream имя должно совпадать с сервисом в docker-compose.yml (backend).
#
# Пример монтирования:
#   frontend:
#     volumes:
#       - ./deploy/nginx/docker-frontend-internal.conf:/etc/nginx/conf.d/default.conf:ro
#
# Примечание: Django Admin на /admin/ из этого образа недоступен без отдачи статики
# отдельно (Whitenoise, общий volume со staticfiles и т.д.). Для SPA+API этого достаточно.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
