services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cat_breeder
      POSTGRES_USER: breeder
      POSTGRES_PASSWORD: breeder123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.breeder_project.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 2"
    volumes:
      - ./backend:/app/backend
      - ./manage.py:/app/manage.py
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: your-secret-key-change-in-prod
      DEBUG: "False"
      DB_NAME: cat_breeder
      DB_USER: breeder
      DB_PASSWORD: breeder123
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      REDIS_URL: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost
      CSRF_TRUSTED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200,http://localhost:8000
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
